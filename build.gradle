plugins {
  id 'java'
  id 'com.github.johnrengelman.shadow' version '8.1.1'
}

repositories {
  mavenCentral()
}

ext {
  icebergVersion = '1.10.1'
  hadoopVersion = '3.4.2'
}

dependencies {
  implementation "org.apache.iceberg:iceberg-api:${icebergVersion}"
  implementation "org.apache.iceberg:iceberg-core:${icebergVersion}"
  implementation "org.apache.iceberg:iceberg-core:${icebergVersion}:tests"
  implementation "org.apache.iceberg:iceberg-aws:${icebergVersion}"
  implementation "org.apache.iceberg:iceberg-azure:${icebergVersion}"
  implementation "org.apache.iceberg:iceberg-gcp:${icebergVersion}"
  implementation "org.apache.iceberg:iceberg-bundled-guava:${icebergVersion}"

  implementation ("org.apache.hadoop:hadoop-common:${hadoopVersion}"){
    exclude group: 'org.eclipse.jetty'
  }
  implementation ("org.apache.hadoop:hadoop-hdfs-client:${hadoopVersion}"){
    exclude group: 'org.eclipse.jetty'
  }

  runtimeOnly "org.apache.iceberg:iceberg-aws-bundle:${icebergVersion}"
  runtimeOnly "org.apache.iceberg:iceberg-azure-bundle:${icebergVersion}"
  runtimeOnly "org.apache.iceberg:iceberg-gcp-bundle:${icebergVersion}"

// https://mvnrepository.com/artifact/org.apache.httpcomponents.client5/httpclient5
  implementation 'org.apache.httpcomponents.client5:httpclient5:5.6'

// https://mvnrepository.com/artifact/org.apache.httpcomponents.core5/httpcore5
  implementation 'org.apache.httpcomponents.core5:httpcore5:5.4'

// https://mvnrepository.com/artifact/com.google.guava/guava
  implementation 'com.google.guava:guava:33.5.0-jre'


// https://mvnrepository.com/artifact/org.xerial/sqlite-jdbc
  implementation 'org.xerial:sqlite-jdbc:3.51.1.0'

// https://mvnrepository.com/artifact/org.postgresql/postgresql
  implementation 'org.postgresql:postgresql:42.7.9'

// https://mvnrepository.com/artifact/com.mysql/mysql-connector-j
  implementation 'com.mysql:mysql-connector-j:9.6.0'

  // https://mvnrepository.com/artifact/jakarta.servlet/jakarta.servlet-api
  implementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'

  // https://mvnrepository.com/artifact/org.eclipse.jetty/jetty-servlets
  implementation 'org.eclipse.jetty:jetty-servlets:11.0.26'

// Source: https://mvnrepository.com/artifact/org.eclipse.jetty.ee10/jetty-ee10-servlet
  implementation("org.eclipse.jetty.ee10:jetty-ee10-servlet:12.1.6")

  // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
  implementation 'org.slf4j:slf4j-api:2.0.17'
  // https://mvnrepository.com/artifact/org.slf4j/slf4j-reload4j
  implementation 'org.slf4j:slf4j-reload4j:2.0.17'

  // Source: https://mvnrepository.com/artifact/org.eclipse.jetty.compression/jetty-compression-gzip
  implementation("org.eclipse.jetty.compression:jetty-compression-gzip:12.1.6")

  // Source: https://mvnrepository.com/artifact/org.eclipse.jetty.compression/jetty-compression-server
  implementation("org.eclipse.jetty.compression:jetty-compression-server:12.1.6")
}

jar {
  manifest {
    attributes 'Main-Class': 'org.apache.iceberg.rest.RESTCatalogServer'
  }
}

shadowJar {
  mergeServiceFiles()
  zip64 true
}

build.dependsOn(shadowJar)
